[project]
name = "options-backtest-lab"
version = "0.2.0"
description = "Historical options backtesting via Black-Scholes-derived synthetic chains"
requires-python = ">=3.11"
# No PySpark: see docs/IMPLEMENTATION_PLAN.md section 12. A full 10-year chain for one
# symbol prices in 0.09s on one core, so distributed compute is pure overhead here.
dependencies = [
    "numpy",
    "scipy",
    "polars",                  # chain generation, dataframe layer
    "duckdb",                  # analytical queries over results Parquet
    "joblib",                  # parallelism across parameter-sweep runs
    "pandas",                  # yfinance interop only
    "pyarrow",
    "pydantic>=2",
    "pyyaml",
    "pandas_market_calendars",
    "yfinance",
    "boto3",
]

[project.optional-dependencies]
# QuantLib is an independent reference implementation used only to
# cross-validate our pricing module. Never imported by the runtime path.
dev = ["pytest", "pytest-cov", "ruff", "QuantLib"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Packaged as ``obl`` rather than a bare ``src`` directory: this package is a
# dependency of options-live-validator, which uses a src/ layout of its own, so
# an installed top-level ``src`` would collide with that repo's own sources.
[tool.setuptools.packages.find]
include = ["obl*"]

# Both registries load their YAML by path at runtime, so it has to ship with the
# wheel or they come up empty when installed as a dependency rather than run
# from a checkout.
[tool.setuptools.package-data]
"obl.strategy" = ["library/*.yaml"]
"obl.instruments" = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not network'"
markers = [
    "network: hits a live data source; deselected by default, run with -m network",
]

[tool.ruff]
line-length = 100
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
